name: Migration CI

on:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "scripts/verify_database.sql"
      - ".github/workflows/migration-ci.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "scripts/verify_database.sql"

jobs:
  db-reset:
    name: supabase db reset (migrations apply cleanly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Supabase CLI is the lockfile's, installed by `npm ci` exactly as ORVION Acceptance does.
      # A `uses:` pin here was a second version authority: it stayed at 2.109.1 after the lockfile
      # moved to 2.120.0, so the two CI database lanes tested different CLIs (SPEC-272).
      - name: Install pinned toolchain
        run: npm ci

      - name: Start local Supabase stack
        run: node_modules/.bin/supabase start

      - name: Apply all migrations on a clean database
        run: node_modules/.bin/supabase db reset

      - name: Run pgTAP invariant tests
        run: node_modules/.bin/supabase test db

      - name: Run database smoke-test (verify_database.sql)
        run: docker exec -i supabase_db_ORVION psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f - < scripts/verify_database.sql

      - name: Stop local Supabase stack
        if: always()
        run: node_modules/.bin/supabase stop || true
