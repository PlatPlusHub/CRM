name: ORVION Acceptance

# The admission boundary. A candidate SHA earns its evidence HERE, on a ref that is
# not `main`, and only then may `main` move to that exact SHA. One workflow, one job,
# one external check identity - `orvion-acceptance` - so there is exactly one contract
# for a Ruleset to require and nothing to aggregate.
#
# No `paths:` and no `paths-ignore:` on purpose. A path-filtered required check
# produces no run for a non-matching push, and a required check that never runs is a
# permanently pending admission. Deterministic compute is cheaper than the classifier
# that would be needed to decide when it is safe to skip.
on:
  push:
    branches:
      - orvion-preflight

permissions:
  contents: read

jobs:
  acceptance:
    name: orvion-acceptance
    # The environment the first full shadow proof actually executed, frozen rather than
    # described. `ubuntu-latest` migrates to a newer OS generation on GitHub's schedule,
    # and this job is about to become the one required admission check - the boundary
    # should not change OS family underneath the evidence that earned it. The successful
    # run reported `Image: ubuntu-24.04`. This is a FAMILY, not an individual image build,
    # so normal image updates still arrive.
    runs-on: ubuntu-24.04
    # The current measured operational bound. This is the REQUIRED admission check for
    # `main`, so a job that never concludes is a repository nothing can be promoted to,
    # and GitHub's 360-minute default is not a bound. A timeout cancels the job, and
    # `cancelled` is not `success`, so the Ruleset refuses the push and `-Certify` reports
    # FAILED: it fails closed. Assertion 155 pins this exact value and the measurement
    # behind it lives in `changes/SPEC-175-required-acceptance-carries-an-exact-bound.md`;
    # retuning it requires fresh evidence and a Change Request that moves both together.
    timeout-minutes: 30
    steps:
      # Pinned to the exact commit the proven run resolved `@v6` to, because a full-length
      # commit SHA is the only immutable Action reference - a tag can be moved. This is a
      # freeze, not an upgrade: `v6` pointed here when the shadow passed. Bump deliberately.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # BASE is current `origin/main`, never `github.event.before`. The question this
      # job answers is "may main move to this SHA", so the range under test is every
      # commit not yet in main - not merely what this push added to the branch.
      - name: Resolve candidate range against main
        shell: pwsh
        run: |
          git fetch origin main --quiet
          $base = (git rev-parse origin/main).Trim()
          $head = '${{ github.sha }}'
          # Fail closed on a divergent candidate rather than reinterpreting it through
          # merge-base. A candidate that does not descend from main is not a candidate
          # for a fast-forward promotion, and silently testing a merge-base range would
          # certify a history that is not the one anybody would push.
          git merge-base --is-ancestor $base $head
          if ($LASTEXITCODE -ne 0) {
            throw "MAIN_NOT_ANCESTOR: origin/main $base does not precede candidate $head"
          }
          "BASE_SHA=$base" >> $env:GITHUB_ENV
          "HEAD_SHA=$head" >> $env:GITHUB_ENV
          Write-Output "candidate range $base..$head"

      - name: Agent Control mutation suite
        shell: pwsh
        run: ./scripts/test_agent_continuity.ps1

      # Repository Consistency is deliberately NOT a separate step: the Gate already
      # invokes it through Repo-Guard, and running it twice would buy a second report
      # of the same evidence rather than a second trust boundary.
      - name: Agent Control Gate over the candidate range
        shell: pwsh
        run: ./scripts/check_agent_continuity.ps1 -Gate -BaseRef $env:BASE_SHA -HeadRef $env:HEAD_SHA

      # AUD-01a's evidence layer, which `Repository Consistency` has and this job did
      # not. These are not a second run of the consistency guard the Gate already
      # invokes - they attack the DETECTORS, and a detector regression is invisible
      # until it produces a false verdict in front of someone. A required check that
      # carries less evidence than the union it replaces makes the repository weaker
      # the day it becomes required.
      #
      # Before `npm ci` deliberately: seconds of pwsh with no database, so the cheap
      # evidence fails first. Each suite's exit code is checked individually, because
      # `shell: pwsh` gates the step on the LAST command only and four bare calls would
      # let a failing first suite pass silently - the vacuous-guard class these suites
      # exist to close.
      - name: Attack the guards themselves
        shell: pwsh
        run: |
          foreach ($suite in 'test_future_date_guard','test_status_contradiction_guard','test_primary_ledger_guard','test_cold_start_state_guard') {
            pwsh -File "scripts/$suite.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$suite FAILED (exit $LASTEXITCODE)" }
          }

      # The Supabase CLI version is the lockfile's, obtained through `npm ci`. Pinning
      # it again in a `uses:` would create a second version authority that can silently
      # disagree with the one developers actually run locally.
      - name: Install pinned toolchain
        run: npm ci

      # `npx` and not the local executable is how the lockfile stopped being the
      # authority: `npx` resolves from the network when `node_modules` has no match,
      # so every `npx supabase` line is a place the boundary can silently run software
      # this repository never chose. Calling `node_modules/.bin/supabase` cannot do
      # that - it either exists because `npm ci` put it there, or it fails.
      - name: Start local Supabase stack
        run: node_modules/.bin/supabase start

      - name: Apply all migrations on a clean database
        run: node_modules/.bin/supabase db reset

      - name: Run pgTAP invariant tests
        run: node_modules/.bin/supabase test db

      - name: Run database smoke-test (verify_database.sql)
        run: docker exec -i supabase_db_ORVION psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f - < scripts/verify_database.sql

      # THE FAILURE PATH OBEYS THE SAME AUTHORITY AS THE HAPPY PATH. This step ran as
      # `npx supabase stop || true` and, on a run that failed before `npm ci`, `npx`
      # fetched supabase 2.117.0 from the network against a lockfile pinning 2.109.0
      # and reported SUCCESS. A boundary whose cleanup installs software the repository
      # did not choose is not a boundary, and `|| true` meant nothing ever said so.
      #
      # The existence test is the whole mechanism: if `npm ci` never ran, or ran and
      # failed, there is no locked CLI here and the honest answer is that there is
      # nothing safe to invoke - not to go and get one. A stack cannot have been started
      # by a CLI that was never installed, so this skips nothing real, and the runner is
      # destroyed after the job regardless.
      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -x node_modules/.bin/supabase ]; then
            node_modules/.bin/supabase stop || true
          else
            echo "no lockfile-installed Supabase CLI present - nothing safe to invoke"
          fi
