name: Agent Control

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve changed range
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git fetch origin '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'
            $base = git merge-base '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'
            "BASE_SHA=$base" >> $env:GITHUB_ENV
            "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_ENV
          } else {
            "BASE_SHA=${{ github.event.before }}" >> $env:GITHUB_ENV
            "HEAD_SHA=${{ github.sha }}" >> $env:GITHUB_ENV
          }
      - name: Run Agent Control mutation suite
        shell: pwsh
        run: ./scripts/test_agent_continuity.ps1
      - name: Enforce governing Change Request
        shell: pwsh
        run: ./scripts/check_agent_continuity.ps1 -Gate -BaseRef $env:BASE_SHA -HeadRef $env:HEAD_SHA
